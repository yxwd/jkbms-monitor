[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; NimBLE-Arduino 2.x —— 体积比内置 BLE 小很多，适合 ESP32-C3
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    knolleary/PubSubClient@^2.8

build_flags =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER

; C3 使用 RISC-V 工具链，PlatformIO 会自动处理
